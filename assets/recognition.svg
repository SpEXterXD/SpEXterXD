<svg viewBox="0 0 1200 120" width="100%" xmlns="http://www.w3.org/2000/svg">

  <rect width="1200" height="120" rx="24" fill="#0b0b0d"></rect>

  <line x1="160" y1="60" x2="1040" y2="60" stroke="#ffffff" stroke-opacity="0.12"></line>

  <circle cx="360" cy="60" r="5" fill="#ffffff"></circle>

  <circle cx="840" cy="60" r="5" fill="#ffffff"></circle>

  <circle cx="360" cy="60" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.15">

    <animate attributeName="r" values="10;24;10" dur="3s" repeatCount="indefinite"></animate>

    <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"></animate>

  </circle>

  <circle cx="840" cy="60" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.15">

    <animate attributeName="r" values="10;24;10" dur="3s" begin="1.2s" repeatCount="indefinite"></animate>

    <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" begin="1.2s" repeatCount="indefinite"></animate>

  </circle>

  <text x="360" y="95" text-anchor="middle" fill="#77777d" font-family="Inter, Arial, sans-serif" font-size="10" letter-spacing="3">
    2025
  </text>

  <text x="840" y="95" text-anchor="middle" fill="#77777d" font-family="Inter, Arial, sans-serif" font-size="10" letter-spacing="3">
    2026
  </text>

</svg>