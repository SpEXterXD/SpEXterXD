<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Nirmalya Pal</title>
  <desc id="desc">Minimal animated identity graphic for software, AI and research.</desc>
  <defs>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".055"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#0b0b0d"/>

  <g clip-path="url(#clip)">
    <g stroke="#fff" stroke-opacity=".045" stroke-width="1">
      <path d="M0 72h1200M0 144h1200M0 216h1200M0 288h1200"/>
      <path d="M120 0v360M240 0v360M360 0v360M480 0v360M600 0v360M720 0v360M840 0v360M960 0v360M1080 0v360"/>
    </g>

    <rect x="-220" y="0" width="220" height="360" fill="url(#scan)">
      <animate attributeName="x" from="-220" to="1200" dur="12s" repeatCount="indefinite"/>
    </rect>

    <text x="600" y="128" text-anchor="middle"
      fill="#fff" font-family="Arial,Helvetica,sans-serif"
      font-size="54" font-weight="600" letter-spacing="6">NIRMALYA PAL</text>

    <text x="600" y="163" text-anchor="middle"
      fill="#9a9a9f" font-family="Arial,Helvetica,sans-serif"
      font-size="14" letter-spacing="3">SOFTWARE / AI / RESEARCH</text>

    <rect x="365" y="190" width="470" height="1" fill="url(#line)"/>

    <path d="M140 245
      C190 245 190 214 240 214
      S290 276 340 276
      S390 232 440 232
      S490 258 540 258
      S590 220 640 220
      S690 270 740 270
      S790 238 840 238
      S890 258 940 258
      S990 224 1060 224"
      fill="none" stroke="#fff" stroke-opacity=".15" stroke-width="2"/>

    <path d="M140 245
      C190 245 190 214 240 214
      S290 276 340 276
      S390 232 440 232
      S490 258 540 258
      S590 220 640 220
      S690 270 740 270
      S790 238 840 238
      S890 258 940 258
      S990 224 1060 224"
      fill="none" stroke="#fff" stroke-width="2"
      stroke-dasharray="10 260">
      <animate attributeName="stroke-dashoffset" from="0" to="-540" dur="4.5s" repeatCount="indefinite"/>
    </path>

    <text x="600" y="324" text-anchor="middle"
      fill="#65656b" font-family="Arial,Helvetica,sans-serif"
      font-size="10" letter-spacing="4">LEARNING · BUILDING · IMPROVING</text>
  </g>
</svg>